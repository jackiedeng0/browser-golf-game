<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Golf</title>
  </head>
  <body>
    <div id="app"></div>
    <svg id="aim-overlay" aria-hidden="true"><line id="drag-line" x1="0" y1="0" x2="0" y2="0" /></svg>

    <div id="hud">
      <div class="panel" id="info">
        <div class="title">Par <span id="par">10</span> · <span id="length">–</span> m</div>
        <dl>
          <dt>Strokes</dt><dd id="strokes">0</dd>
          <dt>Club</dt><dd id="club">–</dd>
          <dt>Lie</dt><dd id="lie">–</dd>
          <dt>Slope</dt><dd id="slope">–</dd>
        </dl>
      </div>
      <div class="top-right">
        <button id="new-hole" type="button">New hole</button>
        <div class="panel" id="wind">
          <svg id="wind-dial" viewBox="-30 -30 60 60" aria-hidden="true">
            <circle class="dial" r="27" />
            <path class="notch" d="M0 -27 L0 -21" />
            <path id="wind-arrow" d="M0 -19 L8 -4 L2.8 -4 L2.8 17 L-2.8 17 L-2.8 -4 L-8 -4 Z" />
          </svg>
          <div>
            <div class="wind-label">Wind</div>
            <div id="wind-speed">–</div>
            <div id="wind-relative"></div>
          </div>
        </div>
      </div>
      <div id="power" hidden>
        <div id="power-fill"></div>
        <span id="power-label"></span>
      </div>
      <div id="pin-marker">
        <span class="pin-arrow" id="pin-left">◀ <span id="pin-left-deg"></span></span>
        <svg class="pin-flag" viewBox="0 0 12 16" aria-hidden="true">
          <path d="M2.5 1.5v13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <path d="M3 1.5l7.5 3-7.5 3z" fill="#e0262b" />
        </svg>
        <span id="pin-dist">–</span>
        <span id="pin-elev"></span>
        <span class="pin-arrow" id="pin-right"><span id="pin-right-deg"></span> ▶</span>
      </div>
      <div id="toast"></div>
      <div id="hint">
        Drag back from the ball and release to shoot · Aim right of the target line to draw, left to fade · Drag elsewhere to look around · Scroll to zoom · C to change club
      </div>
    </div>

    <div id="loading">Generating course…</div>

    <div id="result" hidden>
      <div class="card">
        <h2 id="result-title"></h2>
        <p id="result-detail"></p>
        <button id="result-new" type="button">Play a new hole</button>
        <small>or press Enter</small>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
